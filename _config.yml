title: docs
description: Kho ghi chú kỹ thuật cá nhân bằng tiếng Việt, tổng hợp kiến thức frontend, backend, database, ngôn ngữ lập trình (JavaScript, Python) kèm giải thích cơ chế, ví dụ code và các lưu ý khi áp dụng thực tế.
plugins:
      - jekyll-optional-front-matter
      - jekyll-default-layout
      - jekyll-relative-links
      - jekyll-titles-from-headings

optional_front_matter:
      enabled: true
      remove_originals: true

relative_links:
      enabled: true
      collections: false

titles_from_headings:
      enabled: true
      strip_title: false
      collections: false

exclude:
      - CLAUDE.md
      - README.md
      - "*.url"

sections:
      - dir: fe
        label: FE
        title: Frontend
        description: Kỹ thuật xây dựng giao diện web, tối ưu hiệu năng render và trải nghiệm cuộn, nhập liệu như debounce, throttle, infinite scroll và virtual scroll.
      - dir: be
        label: BE
        title: Backend
        description: Các mẫu thiết kế và kỹ thuật phía server giúp hệ thống đáng tin cậy, dễ mở rộng, dễ kiểm thử như idempotency key và dependency injection.
      - dir: db
        label: DB
        title: Database
        description: Cách cơ sở dữ liệu lưu trữ và truy vấn dữ liệu hiệu quả, gồm index B-Tree, page split, composite index, EXPLAIN và các chiến lược phân trang (offset, cursor).
      - dir: programming-languages
        label: LANG
        title: Programming Languages
        description: Ghi chú theo từng ngôn ngữ lập trình (JavaScript, Python), từ kiểu dữ liệu, vòng lặp, hàm, class đến scope, closure, async/await, Event Loop và GIL.
      - dir: security
        label: SEC
        title: Security
        description: Bảo mật web gồm XSS, CSRF, CORS, CSP, SQL Injection, SSRF, Clickjacking, cookie an toàn và security headers, kèm định nghĩa, ví dụ và cách phòng chống.
